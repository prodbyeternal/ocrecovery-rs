name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ocrecovery-rs

          - name: macOS (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: ocrecovery-rs

          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: ocrecovery-rs

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ocrecovery-rs.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocrecovery-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

  # Attach binaries to GitHub Releases automatically
  release:
    name: Release
    runs-on: ${{ matrix.os }}
    needs: build
    if: github.event_name == 'release'

    strategy:
      matrix:
        include:
          - name: Linux (x86_64)  
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ocrecovery-rs
            asset_name: ocrecovery-rs-linux-x86_64

          - name: macOS (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: ocrecovery-rs
            asset_name: ocrecovery-rs-macos-x86_64

          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: ocrecovery-rs
            asset_name: ocrecovery-rs-macos-aarch64

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ocrecovery-rs.exe
            asset_name: ocrecovery-rs-windows-x86_64.exe

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ocrecovery-${{ matrix.target }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          token: ${{ secrets.GITHUB_TOKEN }}
